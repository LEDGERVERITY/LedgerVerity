name: Live Testnet Source Smoke (Opt-In)
on:
  workflow_dispatch:
  push:
    branches: ['feat/phase03-source-xdr-ingestion']
    paths:
      - 'scripts/live_testnet_source.py'
      - '.github/workflows/live-testnet-source.yml'
permissions:
  contents: read
jobs:
  testnet-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[source]'
      - run: PYTHONPATH=src python scripts/live_testnet_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: testnet-source-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
