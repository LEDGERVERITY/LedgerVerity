name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[source]'
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: ledgerverity --help
      - run: ledgerverity validate-etl --help
      - run: ledgerverity inspect-source --help
      - run: ledgerverity reconcile --help
      - run: ledgerverity validate-etl --input fixtures/synthetic-etl-candidate.jsonl --scope fixtures/synthetic-etl-candidate.scope.json --format json
      - run: ledgerverity fixtures/synthetic-clean.jsonl --format json
      - run: |
          set +e
          ledgerverity fixtures/synthetic-defective.jsonl --format json
          code=$?
          test "$code" -eq 3
