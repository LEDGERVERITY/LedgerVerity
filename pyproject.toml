[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerverity"
version = "0.1.0a0"
description = "Experimental offline Stellar contract-event export consistency checker"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "LedgerVerity contributors" }]
classifiers = ["Programming Language :: Python :: 3", "Development Status :: 3 - Alpha"]

[project.scripts]
ledgerverity = "ledgerverity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
